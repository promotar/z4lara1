<section class="dbt-category"><header class="dbt-category__header"><span>Category</span><h1>{{archive_title}}</h1><p>{{results_count}} articles</p></header><div class="dbt-category__list">{{#posts}}<article><a href="{{url}}"><img src="{{featured_image}}" alt="{{featured_image_alt}}"></a><div><time>{{published_at}}</time><h2><a href="{{url}}">{{title}}</a></h2><p>{{excerpt}}</p><div class="dbt-category__tags">{{#tags}}<a href="{{url}}">#{{name}}</a>{{/tags}}</div></div></article>{{/posts}}</div></section>
