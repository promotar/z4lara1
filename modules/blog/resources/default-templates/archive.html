<section class="dbt-archive"><header class="dbt-heading"><span>Art INPA</span><h1>{{archive_title}}</h1><p>{{results_count}} articles on this page</p></header><div class="dbt-grid">{{#posts}}<article class="dbt-card"><a class="dbt-card__image" href="{{url}}"><img src="{{featured_image}}" alt="{{featured_image_alt}}"></a><div class="dbt-card__body"><a class="dbt-card__category" href="{{category_url}}">{{category}}</a><h2><a href="{{url}}">{{title}}</a></h2><p>{{excerpt}}</p><footer><span>{{author}}</span><time>{{published_at}}</time></footer></div></article>{{/posts}}</div></section>
