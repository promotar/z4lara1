<article class="dbt-single">
    <header class="dbt-single__header"><a class="dbt-kicker" href="{{category_url}}">{{category}}</a><h1>{{title}}</h1><div class="dbt-meta"><span>{{author}}</span><time datetime="{{published_at_iso}}">{{published_at}}</time></div><p>{{excerpt}}</p></header>
    <img class="dbt-single__image" src="{{featured_image}}" alt="{{featured_image_alt}}"><div class="dbt-single__content">{{{content}}}</div><footer class="dbt-tags">{{#tags}}<a href="{{url}}">#{{name}}</a>{{/tags}}</footer>
</article>
